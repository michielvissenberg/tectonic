services:
  postgres:
    image: postgres:16-alpine
    container_name: tectonic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tectonic
    ports:
      - "5432:5432"
    volumes:
      - tectonic-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tectonic"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tectonic-postgres-data:
